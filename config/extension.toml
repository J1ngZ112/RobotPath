[core]
reloadable = true
order = 0

[package]
version = "1.0.0"
category = "simulation"
title = "RobotPath"
description = "Isaac Extension for RobotPath"
authors = ["Jingzhe Feng"]
keywords = ["Simulation","MobileRobot"]
changelog = "docs/CHANGELOG.md"
readme = "docs/README.md"
preview_image = "data/preview.png"
icon = "data/icon.png"

[dependencies]
"omni.kit.uiapp" = {}

# define the Python module that the extension provides
[[python.module]]
name = "ExtCode"
# path = ".." # Linux需要

[settings]
exts."MyExtension".timeout = 5

